[project]
name = "podman-static-nonroot-tests"
version = "0.1.0"
description = "Black-box test suite for the podman-static packaging toolchain"
requires-python = ">=3.10"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["."]
pythonpath = ["."]
norecursedirs = [".venv", "build", "dist", "out", "vm/results"]
markers = [
  "vm: opt-in QEMU VM install matrix (set PODMAN_STATIC_VM_TEST=1)",
  "e2e: opt-in real upstream build (set PODMAN_STATIC_E2E=1)",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["helpers"]
